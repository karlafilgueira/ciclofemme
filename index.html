/* =========================================================
   8E. RELATÓRIO PARA A CONSULTA
   Monta uma página de impressão e deixa o próprio sistema salvar
   em PDF. Sem biblioteca externa, funciona offline.
   ========================================================= */
function esc(t){
  return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* As tags de fechamento do relatório vão montadas em pedaços de
   propósito. O Live Server injeta o script de recarregamento
   automático procurando pela tag de fechamento do body no arquivo
   servido. Se essa tag existir dentro de uma string do JavaScript,
   a injeção cai
   no meio da string e quebra o arquivo inteiro. No GitHub Pages
   isso não acontece, mas assim funciona nos dois. */
var FECHA_HEAD = '<' + '/head><body>';
var FECHA_BODY = '<' + '/body><' + '/html>';

function htmlDoRelatorio(dados){
  var p = dados.perfil || {}, a = dados.analise;
  // A ordem da consulta pode variar: aqui garantimos data crescente.
  var ciclos = dados.ciclos.slice().filter(function(c){ return c.startDate; })
    .sort(function(x,y){ return x.startDate < y.startDate ? -1 : 1; });
  var diarios = dados.diarios.slice().filter(function(r){ return r.date; })
    .sort(function(x,y){ return x.date > y.date ? -1 : 1; });
  var linhas = ciclos.map(function(c, i, arr){
    var ant = i > 0 ? difDias(arr[i-1].startDate, c.startDate) : null;
    return '<tr><td>' + esc(formatarDataLonga(c.startDate)) + '</td><td>' +
      (ant ? esc(ant + ' dias') : '—') + '</td><td>' +
      (ant ? (classificarIntervalo(ant) === 'comum' ? 'faixa comum' : 'fora da faixa comum') : '') + '</td></tr>';
  }).join('');

  var padroes = dados.padroes.map(function(x){
    return '<li><strong>' + esc(x.nome) + '</strong> — ' + esc(frasePadrao(x)) + '</li>';
  }).join('') || '<li>Sem repetição suficiente para descrever padrões.</li>';

  var exames = dados.exames.map(function(e){
    return '<tr><td>' + esc(e.label || rotulo(TIPOS_EXAME, e.type)) + '</td><td>' +
      esc(formatarDataLonga(e.date)) + '</td><td>' + esc(e.notes || '') + '</td></tr>';
  }).join('') || '<tr><td colspan="3">Nenhum exame anotado.</td></tr>';

  var registros = diarios.slice(0, 40).map(function(r){
    var partes = [];
    if (r.flow) partes.push('fluxo ' + rotulo(FLUXOS, r.flow).toLowerCase());
    if (r.mood) partes.push('humor ' + rotulo(HUMORES, r.mood).toLowerCase());
    (r.symptoms || []).forEach(function(x){ partes.push(rotulo(SINTOMAS, x).toLowerCase()); });
    if (!partes.length) return '';
    return '<tr><td>' + esc(formatarData(r.date, {day:'2-digit',month:'2-digit',year:'numeric'})) +
      '</td><td>' + esc(partes.join(', ')) + '</td></tr>';
  }).join('');

  var resumo = a && a.n
    ? '<ul><li>Duração típica (mediana): <strong>' + a.mediana + ' dias</strong></li>' +
      '<li>Mais curto: ' + a.menor + ' dias · mais longo: ' + a.maior + ' dias</li>' +
      '<li>Variação entre os ciclos: ' + a.variacao + ' dias</li>' +
      '<li>Base: ' + a.registros + ' início(s) de menstruação registrado(s)</li></ul>'
    : '<p>Ainda não há ciclos suficientes para calcular a duração típica.</p>';

  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">' +
    '<title>Ciclo Femme — relatório</title><style>' +
    '@page{margin:18mm 14mm}' +
    'body{font-family:Georgia,"Times New Roman",serif;color:#2A1436;font-size:11.5pt;line-height:1.5}' +
    'h1{font-size:20pt;font-weight:normal;letter-spacing:.04em;margin:0}' +
    'h2{font-size:12pt;margin:20px 0 6px;border-bottom:1px solid #EDDDE1;padding-bottom:4px}' +
    '.sub{color:#6E5A78;font-size:9.5pt;margin-top:4px}' +
    'table{width:100%;border-collapse:collapse;margin-top:6px;font-size:10pt}' +
    'th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #F1E4E7;vertical-align:top}' +
    'th{color:#6E5A78;font-weight:normal;font-size:9pt;text-transform:uppercase;letter-spacing:.05em}' +
    'ul{margin:6px 0;padding-left:18px}li{margin-bottom:3px}' +
    '.rodape{margin-top:24px;padding-top:10px;border-top:1px solid #EDDDE1;color:#6E5A78;font-size:9pt;line-height:1.45}' +
    '<' + '/style>' + FECHA_HEAD +
    '<h1>Ciclo Femme</h1>' +
    '<div class="sub">Relatório de acompanhamento · gerado em ' + esc(formatarDataLonga(hojeISO())) + '</div>' +
    '<h2>Identificação</h2><p>' + esc((p.firstName || '') + ' ' + (p.lastName || '')) +
    (p.birthDate ? ' · nascimento em ' + esc(formatarDataLonga(p.birthDate)) : '') + '<br>' +
    'Momento registrado no app: ' + esc(MODOS[dados.modo] ? MODOS[dados.modo].nome : 'Acompanhando meu ciclo') + '</p>' +
    '<h2>Resumo dos ciclos</h2>' + resumo +
    '<h2>Inícios de menstruação registrados</h2>' +
    '<table><tr><th>Primeiro dia</th><th>Intervalo</th><th>Leitura</th></tr>' + linhas + '</table>' +
    '<h2>Sintomas que se repetem</h2><ul>' + padroes + '</ul>' +
    '<h2>Exames e consultas anotados</h2>' +
    '<table><tr><th>Exame</th><th>Data</th><th>Observação</th></tr>' + exames + '</table>' +
    (registros ? '<h2>Registros diários recentes</h2><table><tr><th>Data</th><th>Registro</th></tr>' + registros + '</table>' : '') +
    '<div class="rodape"><strong>Sobre este documento.</strong> Foi gerado a partir de anotações feitas pela própria usuária no aplicativo Ciclo Femme. ' +
    'As durações e faixas são cálculos pelo método do calendário, com caráter informativo. ' +
    'O Ciclo Femme não é um dispositivo médico, não realiza diagnóstico e não substitui avaliação profissional.</div>' +
    FECHA_BODY;
}

function gerarRelatorio(){
  avisar('Montando o relatório…');
  Promise.all([listarCiclos(), listarDiarios(), listarExames()]).then(function(res){
    var dados = {
      perfil: estado.perfil,
      analise: analisarCiclos(res[0]),
      ciclos: res[0],
      diarios: res[1],
      exames: res[2],
      padroes: analisarPadroes(res[1], res[0]),
      modo: modoAtual()
    };
    var quadro = document.getElementById('quadro-relatorio');
    if (quadro) quadro.remove();
    quadro = el('iframe',{id:'quadro-relatorio','aria-hidden':'true',
      style:'position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0'});
    document.body.append(quadro);
    var doc = quadro.contentWindow.document;
    doc.open(); doc.write(htmlDoRelatorio(dados)); doc.close();
    setTimeout(function(){
      try {
        quadro.contentWindow.focus();
        quadro.contentWindow.print();
      } catch (e){
        console.error(e);
        avisar('Seu navegador bloqueou a impressão. Tente pelo menu do navegador.');
      }
    }, 350);
  }).catch(function(e){ console.error(e); avisar(mensagemErro(e)); });
}

/* =========================================================
   9. INICIALIZAÇÃO
   ========================================================= */
function iniciarApp(){
  return lerPerfil().then(function(perfil){
    if (!perfil) return telaOnboarding();
    estado.perfil = perfil;
    return Promise.all([lerConfigCiclo(), listarCiclos(), lerModoVida(), listarDiarios()]).then(function(res){
      estado.config = res[0] ? normalizar(res[0]) : null;
      estado.ciclos = res[1];
      estado.modo = res[2] || {modo:'ciclo'};
      estado.diarios = res[3] || [];
      aplicarHistorico();
      estado.padroes = analisarPadroes(estado.diarios, estado.ciclos);
      nav.classList.remove('oculto');
      tela.style.padding = 'var(--sp-5) var(--sp-5) 96px';
      montarNav();
      if (!location.hash) location.hash = 'inicio';
      renderizar();
    });
  });
}

setTimeout(function(){ $('#abertura').classList.add('saindo'); }, 1900);

auth.onAuthStateChanged(function(u){
  if (!u){
    estado.perfil = null; estado.config = null; estado.ciclos = [];
    if (location.hash) history.replaceState(null, '', location.pathname);
    return telaEntrada();
  }
  tela.innerHTML = '<div class="carregando"><div class="giro"></div></div>';
  iniciarApp().catch(function(e){
    console.error(e);
    tela.innerHTML = '';
    tela.append(el('div',{class:'vazio',html:'<span class="glifo">&#9888;</span>'+mensagemErro(e)}));
  });
});

window.addEventListener('hashchange', function(){
  if (auth.currentUser && estado.perfil) renderizar();
});

/* =========================================================
   10. FUNCIONAMENTO OFFLINE E INSTALAÇÃO
   ========================================================= */
var faixa = el('div',{class:'faixa-conexao',role:'status'});
document.body.prepend(faixa);

function mostrarFaixa(texto, classeExtra, aoClicar){
  faixa.textContent = texto;
  faixa.className = 'faixa-conexao visivel' + (classeExtra ? ' ' + classeExtra : '');
  faixa.onclick = aoClicar || null;
  document.body.classList.add('com-faixa');
}
function esconderFaixa(){
  faixa.className = 'faixa-conexao';
  faixa.onclick = null;
  document.body.classList.remove('com-faixa');
}
function conferirConexao(){
  if (navigator.onLine) esconderFaixa();
  else mostrarFaixa('Sem internet. O app continua funcionando e sincroniza depois.');
}
window.addEventListener('online', function(){
  esconderFaixa();
  avisar('De volta online. Seus registros estão sincronizando.');
});
window.addEventListener('offline', conferirConexao);
conferirConexao();

/* =========================================================
   Service worker: guarda o app para abrir sem internet e avisa
   quando existe versão nova esperando para entrar.

   O sw.js NÃO usa skipWaiting na instalação: a versão nova fica
   parada em "waiting" até a usuária tocar no aviso. É isso que
   faz a faixa aparecer de verdade.
   ========================================================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    // updateViaCache:'none' impede o navegador de entregar um sw.js
    // velho guardado no cache HTTP (o GitHub Pages manda cache de 10 min).
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      var avisando = false;

      function avisarAtualizacao(){
        if (avisando || !reg.waiting) return;
        avisando = true;
        mostrarFaixa('Nova versão disponível. Toque para atualizar.', 'atualizacao', function(){
          mostrarFaixa('Atualizando…', 'atualizacao');
          reg.waiting.postMessage('atualizar-agora');
        });
      }

      // Versão nova já esperando de uma visita anterior.
      if (reg.waiting && navigator.serviceWorker.controller) avisarAtualizacao();

      reg.addEventListener('updatefound', function(){
        var novo = reg.installing;
        if (!novo) return;
        novo.addEventListener('statechange', function(){
          // Sem controller é a primeira instalação: não há o que avisar.
          if (novo.state === 'installed' && navigator.serviceWorker.controller) avisarAtualizacao();
        });
      });

      // Procura versão nova ao abrir, a cada volta ao app e de hora em hora.
      reg.update();
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') reg.update();
      });
      setInterval(function(){ reg.update(); }, 60 * 60 * 1000);
    }).catch(function(e){
      console.warn('Service worker não registrado:', e);
    });

    var recarregando = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (recarregando) return;
      recarregando = true;
      location.reload();
    });
  });
}

/* Convite para instalar, quando o navegador oferecer. */
var promptInstalar = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  promptInstalar = e;
  setTimeout(function(){
    if (!promptInstalar || !auth.currentUser) return;
    mostrarFaixa('Instalar o Ciclo Femme no celular. Toque aqui.', 'atualizacao', function(){
      esconderFaixa();
      promptInstalar.prompt();
      promptInstalar.userChoice.then(function(){ promptInstalar = null; });
    });
  }, 8000);
});
window.addEventListener('appinstalled', function(){
  promptInstalar = null;
  esconderFaixa();
});
</script>
