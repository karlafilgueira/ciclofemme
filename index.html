<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C0D25" media="(prefers-color-scheme: dark)">
<meta name="description" content="Calendário menstrual para acompanhar seu ciclo, seus registros e seu bem-estar.">
<title>Ciclo Femme</title>

<!-- Instalação como app -->
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icons/favicon.png?v=3" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ciclo Femme">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CICLO FEMME — tokens
   ========================================================= */
:root{
  --rosa-900:#8E2E43; --rosa-700:#B23F5B; --rosa-600:#C74C69; --rosa-500:#D1506B;
  --rosa-300:#E79DAF; --rosa-150:#F6D7DF; --rosa-050:#FDEDF1;
  --lilas-800:#56399A; --lilas-600:#7550B8; --lilas-500:#8E63C4;
  --lilas-300:#BCA3E4; --lilas-150:#E4D9F6; --lilas-050:#F3EDFB;
  --verde-500:#6FAE8C; --verde-150:#D6EBE0;
  --ouro-500:#C89B5A; --ouro-300:#E3C69A;
  --tinta-900:#2A1436; --tinta-700:#4A3153; --tinta-500:#6E5A78; --tinta-400:#8F7E98;
  --linha:#EDDDE1; --superficie:#FFFCFB; --creme-100:#FDF4F1; --creme-200:#F8E9E5;
  --bg:var(--creme-100); --surface:var(--superficie); --text:var(--tinta-900);
  --text-soft:var(--tinta-500); --border:var(--linha);
  --primary:var(--rosa-500); --primary-strong:var(--rosa-700); --on-primary:#FFF8F9;
  --danger:#C0392B;
  --font-display:"Jost","Century Gothic",system-ui,sans-serif;
  --font-ui:"Inter",system-ui,-apple-system,sans-serif;
  --t-display:2.75rem; --t-h1:1.625rem; --t-h2:1.125rem;
  --t-body:.9375rem; --t-small:.8125rem; --t-micro:.6875rem;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:44px;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --sombra-suave:0 1px 2px rgba(42,20,54,.04),0 6px 18px rgba(42,20,54,.05);
  --sombra-alta:0 10px 32px rgba(42,20,54,.12);
  --mov-rapido:140ms cubic-bezier(.32,.72,.32,1);
  --mov-medio:240ms cubic-bezier(.32,.72,.32,1);
  --mov-lento:420ms cubic-bezier(.22,.68,.28,1);
  --largura-app:460px;
  --dia-tam:clamp(30px,8.4vw,40px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1C0D25; --surface:#271434; --text:#F6ECF2; --text-soft:#C0AECA;
    --border:#3A2349; --creme-200:#331E42; --rosa-050:#3A1C2C; --rosa-150:#4E2537;
    --lilas-050:#2E1E45; --lilas-150:#3C2757; --verde-150:#274036; }
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ui);font-size:var(--t-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
h1,h2,h3{font-family:var(--font-display);font-weight:300;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--primary-strong)}
:focus-visible{outline:2px solid var(--lilas-500);outline-offset:3px;border-radius:6px}

.app-shell{max-width:var(--largura-app);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.conteudo{flex:1;padding:var(--sp-5) var(--sp-5) 96px}
.tela-titulo{font-size:var(--t-h1);text-align:center;padding:var(--sp-4) 0 var(--sp-2)}
.secao-titulo{font-family:var(--font-ui);font-size:var(--t-small);font-weight:600;
  color:var(--text-soft);margin:var(--sp-6) 0 var(--sp-3)}
.texto-suave{color:var(--text-soft);font-size:var(--t-small)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  width:100%;min-height:52px;padding:0 var(--sp-5);border:none;border-radius:var(--r-pill);
  background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;
  transition:transform var(--mov-rapido),background var(--mov-rapido),box-shadow var(--mov-rapido);
  box-shadow:0 6px 16px rgba(209,80,107,.22)}
.btn:hover{background:var(--primary-strong)}
.btn:active{transform:scale(.97);box-shadow:0 2px 8px rgba(209,80,107,.2)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-secundario{background:transparent;color:var(--primary-strong);border:1px solid var(--rosa-150);box-shadow:none}
.btn-secundario:hover{background:var(--rosa-050)}
.btn-texto{background:none;border:none;box-shadow:none;color:var(--text-soft);
  min-height:44px;width:auto;cursor:pointer;transition:transform var(--mov-rapido)}
.btn-texto:active{transform:scale(.96)}
.btn-icone{width:44px;height:44px;min-height:44px;padding:0;border-radius:var(--r-pill);
  background:transparent;border:none;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;color:var(--text);transition:background var(--mov-rapido),transform var(--mov-rapido)}
.btn-icone:hover{background:var(--creme-200)}
.btn-icone:active{transform:scale(.9)}

.cartao{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--sp-4);box-shadow:var(--sombra-suave)}
.cartao-link{display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--sp-4);cursor:pointer;transition:transform var(--mov-rapido),background var(--mov-rapido)}
.cartao-link:active{transform:scale(.985);background:var(--creme-200)}
.cartao-link .seta{margin-left:auto;color:var(--tinta-400)}

.campo{margin-bottom:var(--sp-4)}
.campo>label{display:block;font-size:var(--t-small);font-weight:500;margin-bottom:var(--sp-2)}
.campo input,.campo select,.campo textarea{width:100%;min-height:50px;padding:var(--sp-3) var(--sp-4);
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);
  color:var(--text);font:inherit;transition:border-color var(--mov-rapido),box-shadow var(--mov-rapido)}
.campo textarea{min-height:96px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;
  border-color:var(--rosa-300);box-shadow:0 0 0 3px var(--rosa-050)}
.campo .ajuda{font-size:var(--t-micro);color:var(--text-soft);margin-top:var(--sp-1)}
.campo.erro{color:var(--danger);font-size:var(--t-small)}

.grade-opcoes{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2)}
.grade-opcoes.col-3{grid-template-columns:repeat(3,1fr)}
.opcao{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-1);border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);cursor:pointer;font-size:var(--t-micro);color:var(--text-soft);
  text-align:center;line-height:1.25;
  transition:transform var(--mov-rapido),border-color var(--mov-rapido),background var(--mov-rapido),color var(--mov-rapido)}
.opcao .glifo{font-size:20px;line-height:1}
.opcao:active{transform:scale(.93)}
.opcao[aria-pressed="true"]{border-color:var(--rosa-300);background:var(--rosa-050);
  color:var(--primary-strong);font-weight:600}

.linha-alternador{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:1px solid var(--border)}
.linha-alternador:last-child{border-bottom:none}
.linha-alternador .rotulo{flex:1}
.alternador{width:50px;height:30px;flex:none;border-radius:var(--r-pill);border:none;
  background:var(--creme-200);position:relative;cursor:pointer;transition:background var(--mov-medio)}
.alternador::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(42,20,54,.25);
  transition:transform var(--mov-medio)}
.alternador[aria-checked="true"]{background:var(--rosa-500)}
.alternador[aria-checked="true"]::after{transform:translateX(20px)}

.linha-escala{display:grid;grid-template-columns:28px 72px 1fr 38px;align-items:center;
  gap:var(--sp-2);padding:var(--sp-2) 0}
.linha-escala .glifo{font-size:17px;text-align:center}
.linha-escala .valor{font-variant-numeric:tabular-nums;font-size:var(--t-small);
  color:var(--text-soft);text-align:right}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:6px;
  border-radius:var(--r-pill);background:var(--rosa-150);outline:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;background:var(--rosa-500);border:3px solid var(--surface);
  box-shadow:0 1px 4px rgba(42,20,54,.25);cursor:pointer;transition:transform var(--mov-rapido)}
input[type="range"]:active::-webkit-slider-thumb{transform:scale(1.25)}
input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:var(--rosa-500);border:3px solid var(--surface);cursor:pointer}

.anel-envoltorio{display:flex;justify-content:center;padding:var(--sp-4) 0 var(--sp-6)}
.anel{width:236px;height:236px}
.anel .trilho{fill:none;stroke:var(--creme-200);stroke-width:12}
.anel .progresso{fill:none;stroke-width:12;stroke-linecap:round;stroke:url(#gradRosa);
  transition:stroke-dashoffset var(--mov-lento)}
.anel-texto .rotulo{font-size:var(--t-small);color:var(--text-soft)}
.anel-texto .numero{font-family:var(--font-display);font-weight:300;font-size:var(--t-display);
  line-height:1.1;color:var(--rosa-700)}
.anel-texto .previsao{font-size:var(--t-micro);color:var(--text-soft)}

.faixa-fases{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-top:var(--sp-4)}
.pilula-fase{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:var(--sp-3) var(--sp-2);text-align:center;font-size:var(--t-micro);color:var(--text-soft)}
.pilula-fase .nome{display:block;font-weight:600;color:var(--text);font-size:var(--t-small);margin:var(--sp-1) 0}

.calendario{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);padding:var(--sp-4);overflow:hidden}
.calendario-cabecalho{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)}
.calendario-mes{font-family:var(--font-display);font-size:var(--t-h2);text-transform:capitalize}
.calendario-grade{display:grid;grid-template-columns:repeat(7,1fr);
  gap:6px 0;justify-items:center;width:100%}
.calendario-dia-semana{text-align:center;font-size:var(--t-micro);color:var(--text-soft);
  padding-bottom:var(--sp-2);width:100%}
/* Tamanho fixo em vez de aspect-ratio: o aspect-ratio dentro de grid
   colapsava a altura das linhas e os dias vazavam por cima da legenda. */
.dia{width:var(--dia-tam);height:var(--dia-tam);min-width:0;flex:none;padding:0;line-height:1;
  display:flex;align-items:center;justify-content:center;border:none;
  background:transparent;border-radius:50%;font-size:var(--t-small);color:var(--text);cursor:pointer;
  transition:transform var(--mov-rapido),background var(--mov-rapido)}
.dia:active{transform:scale(.88)}
.dia.vazio{pointer-events:none;visibility:hidden}
.dia.menstruacao{background:var(--rosa-150);color:var(--rosa-900);font-weight:600}
.dia.fertil{background:var(--verde-150);color:#2F5A45}
.dia.ovulacao{background:var(--lilas-150);color:var(--lilas-800);font-weight:600}
.dia.tpm{background:var(--lilas-050);color:var(--lilas-800)}
.dia.hoje{box-shadow:inset 0 0 0 2px var(--rosa-500)}
.legenda{display:grid;gap:var(--sp-2);margin-top:var(--sp-4)}
.legenda-item{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--t-small);color:var(--text-soft)}
.legenda-cor{width:12px;height:12px;border-radius:50%}

.aviso{display:flex;gap:var(--sp-3);background:var(--lilas-050);border:1px solid var(--lilas-150);
  border-radius:var(--r-md);padding:var(--sp-4);font-size:var(--t-small);color:var(--tinta-700);line-height:1.55}
.aviso .glifo{flex:none;font-size:16px;color:var(--lilas-600)}
.aviso strong{color:var(--lilas-800)}
.aviso-rodape{font-size:var(--t-micro);color:var(--text-soft);text-align:center;
  line-height:1.5;padding:var(--sp-6) var(--sp-2) 0}

/* --- Faixa de estado da conexão --- */
.faixa-conexao{position:fixed;top:0;left:0;right:0;z-index:70;
  background:var(--lilas-150);color:var(--lilas-800);text-align:center;
  font-size:var(--t-micro);padding:var(--sp-2) var(--sp-4);
  transform:translateY(-100%);transition:transform var(--mov-medio)}
.faixa-conexao.visivel{transform:none}
.faixa-conexao.atualizacao{background:var(--rosa-150);color:var(--rosa-900);cursor:pointer}
body.com-faixa .topo{padding-top:calc(var(--sp-4) + 28px)}

.nav-inferior{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;
  max-width:var(--largura-app);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--border);
  padding:var(--sp-2) 0 calc(var(--sp-2) + env(safe-area-inset-bottom));z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;
  border:none;cursor:pointer;font-size:var(--t-micro);color:var(--tinta-400);padding:var(--sp-1) 0;
  transition:color var(--mov-rapido)}
.nav-item .glifo{font-size:19px;transition:transform var(--mov-medio)}
.nav-item:active .glifo{transform:scale(.85)}
.nav-item[aria-current="page"]{color:var(--rosa-600)}
.nav-item[aria-current="page"] .glifo{transform:translateY(-1px) scale(1.08)}

.topo{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) var(--sp-5) 0;
  max-width:var(--largura-app);margin:0 auto;width:100%}
.topo .centro{flex:1;text-align:center}
.topo .saudacao{font-family:var(--font-display);font-size:var(--t-h2)}
.topo .subtitulo{font-size:var(--t-micro);color:var(--text-soft)}

.tela{animation:entrada var(--mov-medio) both}
@keyframes entrada{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);
  background:var(--tinta-900);color:#FFF6FA;padding:var(--sp-3) var(--sp-5);
  border-radius:var(--r-pill);font-size:var(--t-small);box-shadow:var(--sombra-alta);
  opacity:0;pointer-events:none;transition:opacity var(--mov-medio),transform var(--mov-medio);
  z-index:60;max-width:88vw;text-align:center}
.toast.visivel{opacity:1;transform:translate(-50%,0)}

.carregando{display:flex;justify-content:center;padding:var(--sp-8) 0}
.giro{width:26px;height:26px;border-radius:50%;border:2px solid var(--rosa-150);
  border-top-color:var(--rosa-500);animation:girar 700ms linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.vazio{text-align:center;color:var(--text-soft);padding:var(--sp-8) var(--sp-4)}
.vazio .glifo{font-size:30px;display:block;margin-bottom:var(--sp-3);opacity:.6}
.oculto{display:none !important}

/* --- Abertura --- */
.abertura{position:fixed;inset:0;z-index:50;display:grid;place-content:center;
  justify-items:center;background:var(--bg);
  transition:opacity var(--mov-lento),visibility var(--mov-lento)}
.abertura.saindo{opacity:0;visibility:hidden}
.marca-nome{font-family:var(--font-display);font-weight:200;font-size:3.25rem;
  letter-spacing:.06em;color:var(--rosa-900);margin-top:var(--sp-4)}
.marca-sub{font-family:var(--font-display);font-weight:300;font-size:1.05rem;
  letter-spacing:.42em;color:var(--rosa-500);margin-left:.42em}
.marca-lema{margin-top:var(--sp-7);text-align:center;font-family:var(--font-display);
  font-size:1.05rem;color:var(--tinta-700);line-height:1.7}
.fio{width:56px;height:1px;background:var(--ouro-300);margin:var(--sp-6) auto}
.marca-rodape{text-align:center;font-family:var(--font-display);color:var(--tinta-500);line-height:1.7}
.anel-marca .aro{animation:tracar 1400ms var(--mov-lento) both}
.anel-marca .conta{animation:surgir 600ms 900ms both;transform-origin:176px 118px}
@keyframes tracar{from{stroke-dashoffset:400}to{stroke-dashoffset:34}}
@keyframes surgir{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}

.painel{padding:var(--sp-6) var(--sp-5) var(--sp-8);max-width:var(--largura-app);margin:0 auto}
.painel-topo{text-align:center;margin-bottom:var(--sp-7)}
.painel-topo h1{font-size:var(--t-display);font-weight:200;color:var(--rosa-900)}
.painel-topo p{color:var(--text-soft);margin-top:var(--sp-2)}
.abas{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--creme-200);
  padding:4px;border-radius:var(--r-pill);margin-bottom:var(--sp-6)}
.aba{border:none;background:transparent;border-radius:var(--r-pill);min-height:42px;
  cursor:pointer;color:var(--text-soft);font-weight:500;
  transition:background var(--mov-medio),color var(--mov-medio),transform var(--mov-rapido)}
.aba:active{transform:scale(.97)}
.aba[aria-selected="true"]{background:var(--surface);color:var(--rosa-700);box-shadow:var(--sombra-suave)}
.divisor{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-6) 0;
  color:var(--tinta-400);font-size:var(--t-small)}
.divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--border)}

.barra-etapas{display:grid;grid-auto-flow:column;gap:6px;flex:1}
.barra-etapas span{height:3px;border-radius:var(--r-pill);background:var(--creme-200);
  transition:background var(--mov-medio)}
.barra-etapas span.feito{background:var(--rosa-500)}

.doc h2{font-family:var(--font-ui);font-size:var(--t-body);font-weight:600;margin:var(--sp-5) 0 var(--sp-2)}
.doc p{color:var(--text-soft);margin-bottom:var(--sp-3);line-height:1.65;font-size:var(--t-small)}


/* --- Leitura do intervalo entre ciclos --- */
.nota-ciclo{border:1px solid var(--border);background:var(--surface);
  border-radius:var(--r-md);padding:var(--sp-4);margin-top:var(--sp-4);
  font-size:var(--t-small);line-height:1.55;animation:entrada var(--mov-medio) both}
.nota-ciclo strong{display:block;margin-bottom:var(--sp-1);font-size:var(--t-body);color:var(--text)}
.nota-ciclo.ok{background:var(--verde-150);border-color:transparent}
.nota-ciclo.fora{background:var(--lilas-050);border-color:var(--lilas-150)}
.nota-ciclo .rodape{display:block;margin-top:var(--sp-2);color:var(--text-soft)}
.marca{display:inline-block;padding:1px 8px;border-radius:var(--r-pill);
  font-size:var(--t-micro);letter-spacing:.02em;white-space:nowrap}
.marca.ok{background:var(--verde-150);color:#2F5A45}
.marca.fora{background:var(--lilas-150);color:var(--lilas-800)}
.marca.alerta{background:var(--rosa-150);color:var(--rosa-900)}
.marca.neutra{background:var(--creme-200);color:var(--text-soft)}

/* --- Anel --- */
.anel .fase-arco{fill:none;stroke-linecap:round;opacity:.85}
.anel .ponto-hoje{fill:var(--surface);stroke:var(--rosa-500);stroke-width:3}

/* --- Padrões de sintomas --- */
.padrao{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--sp-4);margin-bottom:var(--sp-3)}
.padrao .cabeca{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.padrao .cabeca strong{flex:1}
.trilha{position:relative;height:10px;border-radius:var(--r-pill);

<script>
/* =========================================================
   1. CONFIGURAÇÃO — troque pelos dados do SEU projeto Firebase
   Console do Firebase → Configurações do projeto → Seus apps → Web
   ========================================================= */
var firebaseConfig = {

  authDomain: "ciclo-femme.firebaseapp.com",

};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

/* Cache offline do Firestore.
   Com isso, o app lê seus dados sem internet e guarda o que você
   escrever, sincronizando sozinho quando a conexão voltar.
   Falha só quando há várias abas abertas ou o navegador não suporta —
   nesse caso o app segue funcionando, mas apenas online. */
db.enablePersistence({ synchronizeTabs: true }).catch(function (e) {
  console.warn('Cache offline indisponível:', e && e.code);
});

/* =========================================================
   2. UTILITÁRIOS
   ========================================================= */
function $(sel, raiz){ return (raiz||document).querySelector(sel); }
function el(tag, attrs, filhos){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'texto') e.textContent = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  [].concat(filhos || []).forEach(function(f){ if (f) e.append(f); });
  return e;
}
var toastEl, toastTimer;
function avisar(texto){
  if (!toastEl){ toastEl = el('div',{class:'toast',role:'status'}); document.body.append(toastEl); }
  toastEl.textContent = texto;
  toastEl.classList.add('visivel');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('visivel'); }, 2600);
}
function ocupar(btn, ocupado, textoOriginal){
  if (ocupado){ btn.dataset.texto = btn.textContent; btn.disabled = true; btn.textContent = 'Só um instante…'; }
  else { btn.disabled = false; btn.textContent = textoOriginal || btn.dataset.texto || btn.textContent; }
}
function vibrar(){ if (navigator.vibrate) navigator.vibrate(8); }

function grupoSelecao(container, multiplo){
  container.addEventListener('click', function(e){
    var btn = e.target.closest('.opcao');
    if (!btn || !container.contains(btn)) return;
    var ativo = btn.getAttribute('aria-pressed') === 'true';
    if (!multiplo){
      Array.prototype.forEach.call(container.querySelectorAll('.opcao'), function(b){
        b.setAttribute('aria-pressed','false');
      });
    }
    btn.setAttribute('aria-pressed', String(!ativo));
    vibrar();
  });
}
function selecionados(container, multiplo){
  var ativos = Array.prototype.map.call(
    container.querySelectorAll('.opcao[aria-pressed="true"]'), function(b){ return b.dataset.valor; });
  return multiplo ? ativos : (ativos[0] || null);
}
function marcarSelecao(container, valor){
  var vals = [].concat(valor || []);
  Array.prototype.forEach.call(container.querySelectorAll('.opcao'), function(b){
    b.setAttribute('aria-pressed', String(vals.indexOf(b.dataset.valor) !== -1));
  });
}
function alternador(btn, inicial, aoMudar){
  btn.setAttribute('role','switch');
  btn.setAttribute('aria-checked', String(!!inicial));
  btn.addEventListener('click', function(){
    var novo = btn.getAttribute('aria-checked') !== 'true';
    btn.setAttribute('aria-checked', String(novo));
    vibrar();
    if (aoMudar) aoMudar(novo);
  });
}
function ligado(btn){ return btn.getAttribute('aria-checked') === 'true'; }

/* =========================================================
   3. DATAS E MOTOR DO CICLO
   Todas as saídas são ESTIMATIVAS pelo método do calendário.
   ========================================================= */
function paraISO(d){
  d = new Date(d);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function deISO(iso){ var p = String(iso).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function hojeISO(){ return paraISO(new Date()); }
function somarDias(iso, n){ var d = deISO(iso); d.setDate(d.getDate()+n); return paraISO(d); }
function difDias(a, b){ return Math.round((deISO(b) - deISO(a)) / 86400000); }
function formatarData(iso, op){ return deISO(iso).toLocaleDateString('pt-BR', op || {day:'numeric',month:'long'}); }
function formatarDataLonga(iso){ return formatarData(iso,{day:'numeric',month:'long',year:'numeric'}); }

var FASES = {
  menstruacao:{nome:'Menstruação',      cor:'var(--rosa-500)',  classe:'menstruacao'},
  folicular:  {nome:'Fase folicular',   cor:'var(--ouro-500)',  classe:'folicular'},
  fertil:     {nome:'Período fértil',   cor:'var(--verde-500)', classe:'fertil'},
  ovulacao:   {nome:'Ovulação',         cor:'var(--lilas-500)', classe:'ovulacao'},
  lutea:      {nome:'Fase lútea',       cor:'var(--lilas-300)', classe:'lutea'},
  tpm:        {nome:'Fase lútea (TPM)', cor:'var(--lilas-300)', classe:'tpm'}
};

function limitar(n,min,max){ return Math.min(max, Math.max(min, n)); }
function normalizar(cfg){
  cfg = cfg || {};
  return {
    ultimaMenstruacao: cfg.ultimaMenstruacao || null,
    duracaoCiclo: limitar(Number(cfg.duracaoCiclo) || 28, 21, 45),
    duracaoMenstruacao: limitar(Number(cfg.duracaoMenstruacao) || 5, 1, 10),
    faseLutea: 14,
    ajusteAutomatico: cfg.ajusteAutomatico !== false
  };
}
function inicioDoCiclo(cfg, iso){
  cfg = normalizar(cfg);
  if (!cfg.ultimaMenstruacao) return null;
  var voltas = Math.floor(difDias(cfg.ultimaMenstruacao, iso) / cfg.duracaoCiclo);
  return somarDias(cfg.ultimaMenstruacao, voltas * cfg.duracaoCiclo);
}
function marcosDoCiclo(cfg, inicio){
  var c = normalizar(cfg);
  var ovulacao = somarDias(inicio, c.duracaoCiclo - c.faseLutea - 1);
  return {
    inicio: inicio,
    fimMenstruacao: somarDias(inicio, c.duracaoMenstruacao - 1),
    inicioFertil: somarDias(ovulacao, -5),
    ovulacao: ovulacao,
    fimFertil: somarDias(ovulacao, 1),
    inicioTPM: somarDias(inicio, c.duracaoCiclo - 5),
    proximaMenstruacao: somarDias(inicio, c.duracaoCiclo),
    fim: somarDias(inicio, c.duracaoCiclo - 1)
  };
}
function entre(iso, de, ate){ return difDias(de, iso) >= 0 && difDias(iso, ate) >= 0; }
function faseDoDia(cfg, iso){
  var inicio = inicioDoCiclo(cfg, iso);
  if (!inicio) return null;
  var m = marcosDoCiclo(cfg, inicio);
  if (entre(iso, m.inicio, m.fimMenstruacao)) return 'menstruacao';
  if (iso === m.ovulacao) return 'ovulacao';
  if (entre(iso, m.inicioFertil, m.fimFertil)) return 'fertil';
  if (entre(iso, m.inicioTPM, m.fim)) return 'tpm';
  if (difDias(m.ovulacao, iso) > 0) return 'lutea';
  return 'folicular';
}
function resumoAtual(cfg, iso){
  iso = iso || hojeISO();
  var c = normalizar(cfg);
  if (!c.ultimaMenstruacao) return null;
  var inicio = inicioDoCiclo(c, iso);
  var m = marcosDoCiclo(c, inicio);
  var dia = difDias(inicio, iso) + 1;
  return {
    diaDoCiclo: dia,
    duracaoCiclo: c.duracaoCiclo,
    progresso: Math.min(1, Math.max(0, (dia-1)/c.duracaoCiclo)),
    fase: faseDoDia(c, iso),
    diasParaMenstruacao: difDias(iso, m.proximaMenstruacao),
    proximaMenstruacao: m.proximaMenstruacao,
    marcos: m
  };
}
function mapaDoMes(cfg, ano, mes){
  var mapa = {}, c = normalizar(cfg);
  if (!c.ultimaMenstruacao) return mapa;
  // Gestação, pós-parto e menopausa: não faz sentido projetar fases.
  if (typeof acompanhandoCiclo === 'function' && !acompanhandoCiclo()) return mapa;
  var total = new Date(ano, mes+1, 0).getDate();
  for (var d = 1; d <= total; d++){
    var iso = paraISO(new Date(ano, mes, d));
    if (difDias(c.ultimaMenstruacao, iso) < 0) continue;
    var f = faseDoDia(c, iso);
    if (f && f !== 'folicular' && f !== 'lutea') mapa[iso] = f;
  }
  return mapa;
}
/* Analisa os inícios de menstruação já registrados e devolve os números
   que sustentam a previsão. Usa a MEDIANA como duração de referência:
   um único ciclo atípico (doença, viagem, estresse) desloca a média, mas
   quase não mexe na mediana. */
function analisarCiclos(ciclos){
  var inicios = (ciclos||[]).map(function(c){ return c.startDate; })
    .filter(Boolean).sort()
    .filter(function(v,i,arr){ return i === 0 || v !== arr[i-1]; });
  if (!inicios.length) return null;

  var todos = [];
  for (var i = 1; i < inicios.length; i++){
    var d = difDias(inicios[i-1], inicios[i]);
    if (d >= 15 && d <= 60) todos.push(d);   // fora disso é erro de digitação
  }
  var ultimoInicio = inicios[inicios.length-1];
  if (!todos.length) return {n:0, registros:inicios.length, ultimoInicio:ultimoInicio};

  var recentes = todos.slice(-6);            // últimos 6 ciclos
  var ord = recentes.slice().sort(function(a,b){ return a-b; });
  var meio = Math.floor(ord.length/2);
  var mediana = ord.length % 2 ? ord[meio] : Math.round((ord[meio-1]+ord[meio])/2);
  var media = Math.round(recentes.reduce(function(a,b){ return a+b; },0)/recentes.length);
  var menor = ord[0], maior = ord[ord.length-1];
  var variacao = maior - menor;

  return {
    n: recentes.length,
    registros: inicios.length,
    intervalos: recentes,
    media: media,
    mediana: mediana,
    menor: menor,
    maior: maior,
    variacao: variacao,
    ultimoInicio: ultimoInicio,
    confianca: (recentes.length >= 3 && variacao <= 4) ? 'alta'
             : (recentes.length >= 2 && variacao <= 9) ? 'media' : 'baixa'
  };
}

/* Faixa em que a maior parte dos ciclos adultos costuma cair.
   Não é meta nem regra: 28 dias é apenas a média mais citada, e ciclos
   de 21 a 35 dias são igualmente comuns. Nada aqui diagnostica nada. */
var CICLO_MIN = 21, CICLO_MAX = 35;

function classificarIntervalo(dias){
  if (dias < CICLO_MIN) return 'curto';
  if (dias > CICLO_MAX) return 'longo';
  return 'comum';
}

/* Mensagem mostrada quando um ciclo retroativo é adicionado.
   Devolve {classe, titulo, texto, rodape}. */
function lerCicloAdicionado(iso){
  var inicios = estado.ciclos.map(function(c){ return c.startDate; }).filter(Boolean).sort();
  var pos = inicios.indexOf(iso);

  if (pos < 1){
    return {classe:'', titulo:'Ciclo adicionado.',
      texto:'Registre também o ciclo anterior a este para o app começar a comparar a duração entre eles.'};
  }

  var dias = difDias(inicios[pos-1], iso);
  var tipo = classificarIntervalo(dias);
  var seguinte = pos < inicios.length - 1 ? difDias(iso, inicios[pos+1]) : null;
  var a = estado.analise;
  var foraRecentes = (a && a.intervalos ? a.intervalos : []).filter(function(d){
    return classificarIntervalo(d) !== 'comum';
  }).length;

  var r;
  if (tipo === 'comum'){
    r = {classe:'ok', titulo:dias + ' dias desde o ciclo anterior.',
         texto:'Está dentro da faixa mais comum, que vai de ' + CICLO_MIN + ' a ' + CICLO_MAX + ' dias.'};
  } else {
    r = {classe:'fora', titulo:dias + ' dias desde o ciclo anterior.',
         texto:(tipo === 'curto' ? 'É mais curto' : 'É mais longo') +
               ' que a faixa comum (' + CICLO_MIN + ' a ' + CICLO_MAX + ' dias). Um mês fora da média acontece com frequência: estresse, viagem, sono e alguns remédios já mudam o intervalo.'};
  }

  if (tipo !== 'comum' && foraRecentes >= 2){
    r.rodape = 'Isso apareceu em ' + foraRecentes + ' dos seus últimos ciclos registrados. Se continuar se repetindo, vale comentar com sua ginecologista — e este histórico ajuda nessa conversa.';
  } else if (seguinte !== null){
    r.rodape = 'O ciclo seguinte a este durou ' + seguinte + ' dias.';
  } else {
    r.rodape = 'O Ciclo Femme acompanha e estima. Ele não diagnostica nada.';
  }
  return r;
}

function mediaDosCiclos(ciclos){
  var a = analisarCiclos(ciclos);
  return (a && a.n) ? a.mediana : null;
}

/* Ajusta a configuração com o que o histórico mostra:
   a âncora passa a ser o início mais recente registrado e a duração
   passa a ser a mediana dos ciclos reais. */
function aplicarHistorico(){
  estado.analise = analisarCiclos(estado.ciclos);
  var a = estado.analise;
  if (!a || !estado.config) return;
  if (a.ultimoInicio && estado.config.ultimaMenstruacao &&
      difDias(estado.config.ultimaMenstruacao, a.ultimoInicio) > 0){
    estado.config.ultimaMenstruacao = a.ultimoInicio;
  }
  if (estado.config.ajusteAutomatico !== false && a.n >= 2){
    estado.config.duracaoCiclo = limitar(a.mediana, 21, 45);
  }
}

/* Faixa provável da próxima menstruação, a partir da variação observada. */
function faixaPrevisao(dataCentral){
  var a = estado.analise;
  var margem = (a && a.n >= 2) ? Math.min(7, Math.max(1, Math.ceil(a.variacao/2))) : 3;
  return { de: somarDias(dataCentral, -margem), ate: somarDias(dataCentral, margem), margem: margem };
}

function textoBaseDaPrevisao(){
  var a = estado.analise;
  if (!a || !a.n) return 'Estimativa inicial, ainda sem ciclos anteriores para comparar.';
  return 'Baseado em ' + a.n + (a.n === 1 ? ' ciclo registrado' : ' ciclos registrados') +
         ' · duração típica de ' + a.mediana + ' dias' +
         (a.variacao ? ' · variação de ' + a.variacao + (a.variacao === 1 ? ' dia' : ' dias') : '');
}

/* =========================================================
   3B. PADRÕES: sintoma x fase do ciclo
   Cruza os registros diários com os inícios de menstruação já
   registrados. Descreve o que se repete; não explica causas nem
   sugere tratamento.
   ========================================================= */
function cicloDoDia(inicios, iso){
  var ini = null, prox = null;
  for (var i = 0; i < inicios.length; i++){
    if (difDias(inicios[i], iso) >= 0){ ini = inicios[i]; prox = inicios[i+1] || null; }
  }
  if (!ini) return null;
  return {inicio:ini, proximo:prox, dia:difDias(ini, iso) + 1,
          antes: prox ? difDias(iso, prox) : null};
}

function mediana(lista){
  if (!lista.length) return null;
  var o = lista.slice().sort(function(a,b){ return a-b; }), m = Math.floor(o.length/2);
  return o.length % 2 ? o[m] : Math.round((o[m-1] + o[m]) / 2);
}

/* Devolve uma lista de padrões, do mais frequente para o menos. */
function analisarPadroes(diarios, ciclos){
  var inicios = (ciclos||[]).map(function(c){ return c.startDate; }).filter(Boolean).sort();
  if (inicios.length < 2) return [];

  var porSintoma = {}, ciclosComRegistro = {};
  (diarios||[]).forEach(function(r){
    var c = cicloDoDia(inicios, r.date);
    if (!c) return;
    ciclosComRegistro[c.inicio] = true;
    var lista = (r.symptoms || []).slice();
    if (r.flow) lista.push('__fluxo');
    lista.forEach(function(sint){
      var p = porSintoma[sint] || (porSintoma[sint] = {ciclos:{}, dias:[], antes:[], vezes:0});
      p.ciclos[c.inicio] = true;
      p.vezes++;
      p.dias.push(c.dia);
      if (c.antes !== null) p.antes.push(c.antes);
    });
  });

  var totalCiclos = Object.keys(ciclosComRegistro).length;
  var saida = [];
  Object.keys(porSintoma).forEach(function(sint){
    if (sint === '__fluxo') return;
    var p = porSintoma[sint];
    var nCiclos = Object.keys(p.ciclos).length;
    if (nCiclos < 2) return;                       // um mês só não é padrão
    saida.push({
      id: sint,
      nome: rotulo(SINTOMAS, sint),
      ciclos: nCiclos,
      totalCiclos: totalCiclos,
      vezes: p.vezes,
      diaTipico: mediana(p.dias),
      diaMin: Math.min.apply(null, p.dias),
      diaMax: Math.max.apply(null, p.dias),
      antesTipico: p.antes.length >= 2 ? mediana(p.antes) : null,
      forca: nCiclos / Math.max(1, totalCiclos)
    });
  });
  saida.sort(function(a,b){ return (b.forca - a.forca) || (b.vezes - a.vezes); });
  return saida;
}

function frasePadrao(p){
  var dMenst = (estado.config && estado.config.duracaoMenstruacao) || 5;
  var quando;
  if (p.diaTipico <= dMenst){
    quando = p.diaTipico === 1 ? 'no primeiro dia da menstruação'
                               : 'durante a menstruação, por volta do dia ' + p.diaTipico;
  } else if (p.antesTipico !== null && p.antesTipico <= 10){
    quando = p.antesTipico === 0 ? 'no dia em que a menstruação começou'
      : 'cerca de ' + p.antesTipico + (p.antesTipico === 1 ? ' dia' : ' dias') + ' antes da menstruação';
  } else {
    quando = 'por volta do dia ' + p.diaTipico + ' do ciclo';
  }
  return 'Apareceu em ' + p.ciclos + ' dos seus últimos ' + p.totalCiclos +
         (p.totalCiclos === 1 ? ' ciclo' : ' ciclos') + ' com registro, ' + quando + '.';
}

/* Padrão que se encaixa nos próximos dias, para o aviso da tela inicial. */
function padraoProximo(padroes, diasParaMenstruacao){
  if (diasParaMenstruacao === null || diasParaMenstruacao === undefined) return null;
  for (var i = 0; i < padroes.length; i++){
    var p = padroes[i];
    if (p.antesTipico === null || p.antesTipico > 10 || p.ciclos < 2 || p.forca < 0.5) continue;
    var falta = diasParaMenstruacao - p.antesTipico;
    if (falta >= 0 && falta <= 2) return {padrao:p, falta:falta};
  }
  return null;
}

/* O Firestore aplica a escrita no cache local na hora, mas a promessa só
   resolve quando o servidor confirma. Sem internet isso nunca chega, então
   não adianta esperar: devolvemos false e o app avisa que salvou local. */
function confirmarEscrita(operacao){
  if (!navigator.onLine) return Promise.resolve(false);
  return new Promise(function(resolver, rejeitar){
    var respondeu = false;
    operacao.then(function(){ respondeu = true; resolver(true); },
                  function(e){ respondeu = true; rejeitar(e); });
    setTimeout(function(){ if (!respondeu) resolver(false); }, 6000);
  });
}
function avisarSalvo(confirmado, textoOnline){
  avisar(confirmado ? (textoOnline || 'Registro salvo.')
                    : 'Salvo neste aparelho. Vai sincronizar quando a internet voltar.');
}

/* O perfil aceita SOMENTE estas 5 chaves — qualquer campo extra é recusado pelas regras. */
function salvarPerfil(dados){
  return DB.perfil().get().then(function(s){
    return confirmarEscrita(DB.perfil().set({
      firstName: String(dados.firstName).trim().slice(0,59),
      lastName: dados.lastName ? String(dados.lastName).trim() : null,
      birthDate: String(dados.birthDate),
      createdAt: s.exists ? s.data().createdAt : new Date().toISOString(),
      isAnonymous: !!dados.isAnonymous
    }));
  });
}
function lerPerfil(){ return DB.perfil().get().then(function(s){ return s.exists ? s.data() : null; }); }
function salvarConfigCiclo(cfg){
  return confirmarEscrita(DB.ciclo().set({
    ultimaMenstruacao: cfg.ultimaMenstruacao,
    duracaoCiclo: Number(cfg.duracaoCiclo),
    duracaoMenstruacao: Number(cfg.duracaoMenstruacao),
    ajusteAutomatico: cfg.ajusteAutomatico !== false,
    atualizadoEm: new Date().toISOString()
  }, {merge:true}));
}
function lerConfigCiclo(){ return DB.ciclo().get().then(function(s){ return s.exists ? s.data() : null; }); }
function registrarCiclo(inicio){
  return confirmarEscrita(DB.ciclos().doc(inicio).set({startDate:inicio, endDate:null, criadoEm:new Date().toISOString()}, {merge:true}));
}
function excluirCiclo(id){ return confirmarEscrita(DB.ciclos().doc(id).delete()); }
function listarCiclos(){
  return DB.ciclos().orderBy('startDate','desc').limit(120).get().then(function(s){
    return s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }).reverse();
  });
}
function salvarDiario(data, dados){
  return confirmarEscrita(DB.diarios().doc(data).set(Object.assign({date:data, atualizadoEm:new Date().toISOString()}, dados), {merge:true}));
}
function lerDiario(data){ return DB.diarios().doc(data).get().then(function(s){ return s.exists ? s.data() : null; }); }
function listarDiarios(){
  return DB.diarios().orderBy('date','desc').limit(180).get().then(function(s){
    return s.docs.map(function(d){ return d.data(); });
  });
}
function salvarFertilidade(data, dados){
  return confirmarEscrita(DB.ferteis().doc(data).set(Object.assign({date:data, atualizadoEm:new Date().toISOString()}, dados), {merge:true}));
}
function lerFertilidade(data){ return DB.ferteis().doc(data).get().then(function(s){ return s.exists ? s.data() : null; }); }
function lerNotificacoes(){
  return DB.notif().get().then(function(s){
    return s.exists ? s.data() : {antesMenstruacao:true, janelaFertil:true, registroDiario:false};
  });
}
/* --- Exames preventivos --- */
function salvarExame(id, dados){
  var doc = id ? DB.exames().doc(id) : DB.exames().doc();
  return confirmarEscrita(doc.set(Object.assign({}, dados, {atualizadoEm:new Date().toISOString()}), {merge:true}))
    .then(function(ok){ return {ok:ok, id:doc.id}; });
}
function excluirExame(id){ return confirmarEscrita(DB.exames().doc(id).delete()); }
function listarExames(){
  return DB.exames().orderBy('date','desc').limit(60).get().then(function(s){
    return s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
}

/* --- Modo de vida (ciclo, gestação, pós-parto, menopausa) --- */
function lerModoVida(){
  return DB.modo().get().then(function(s){ return s.exists ? s.data() : {modo:'ciclo'}; });
}
function salvarModoVida(m){
  return confirmarEscrita(DB.modo().set(Object.assign({}, m, {atualizadoEm:new Date().toISOString()})));
}

function salvarNotificacoes(p){ return confirmarEscrita(DB.notif().set(Object.assign({}, p, {atualizadoEm:new Date().toISOString()}), {merge:true})); }

function excluirTudo(){
  var cols = [DB.ciclos(), DB.diarios(), DB.ferteis(), DB.exames()];
  return Promise.all(cols.map(function(c){
    return c.get().then(function(s){ return Promise.all(s.docs.map(function(d){ return d.ref.delete(); })); });
  })).then(function(){
    return Promise.all([DB.ciclo().delete().catch(function(){}),
                        DB.notif().delete().catch(function(){}),
                        DB.modo().delete().catch(function(){})]);
  }).then(function(){ return DB.perfil().delete(); });
}

function mensagemErro(e){
  var mapa = {
    'auth/invalid-email':'Esse e-mail não parece válido.',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Entre por ele.',
    'auth/invalid-credential':'E-mail ou senha não conferem.',
    'auth/wrong-password':'E-mail ou senha não conferem.',
    'auth/user-not-found':'Não encontramos uma conta com esse e-mail.',
    'auth/too-many-requests':'Muitas tentativas seguidas. Espere alguns minutos.',
    'auth/network-request-failed':'Sem conexão. Verifique sua internet.',
    'auth/operation-not-allowed':'Esse tipo de acesso ainda não foi liberado no Firebase.',
    'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase Authentication.',
    'auth/requires-recent-login':'Por segurança, entre de novo antes de excluir a conta.',

}

      ? auth.signInWithEmailAndPassword(e, s)
      : auth.createUserWithEmailAndPassword(e, s);

      .then(function(){ avisar('Link enviado. Confira seu e-mail.'); })
      .catch(function(err){ mostrarErro(mensagemErro(err)); });
  };
}

  nav.classList.add('oculto');

  );

  var nascimento = el('input',{type:'date'});

    el('p',{class:'texto-suave',style:'margin-bottom:var(--sp-6)',texto:'Para personalizar sua experiência, precisamos de algumas informações sobre você.'}),
    campo('Como quer ser chamada', nome),
    campo('Sobrenome (opcional)', sobrenome),
    campo('Data de nascimento', nascimento, 'Usada só para ajustar as estimativas à sua fase de vida.')
  );

  var s2 = el('section',{class:'tela oculto'});
  s2.append(
    el('h1',{style:'font-size:var(--t-display);font-weight:200;color:var(--rosa-900)',texto:'Seu ciclo'}),
    el('p',{class:'texto-suave',style:'margin-bottom:var(--sp-6)',texto:'Quanto mais próximo do real, melhores ficam as estimativas. Dá para ajustar tudo depois.'}),
    campo('Primeiro dia da última menstruação', ultima, 'Se não lembrar exatamente, escolha a data mais próxima.'),
    campo('Duração média do ciclo (dias)', dCiclo, 'Entre 21 e 45 dias.'),
    campo('Duração média da menstruação (dias)', dMenst, 'Entre 1 e 10 dias.')
  );

  var s3 = el('section',{class:'tela oculto'});
  s3.append(
    el('h1',{style:'font-size:var(--t-display);font-weight:200;color:var(--rosa-900)',texto:'Antes de entrar'}),
    el('p',{class:'texto-suave',style:'margin-bottom:var(--sp-6)',texto:'Três coisas que valem ser ditas com clareza.'}),
    el('div',{class:'aviso',style:'margin-bottom:var(--sp-4)',html:
      '<span class="glifo">&#9432;</span><div><strong>Tudo aqui é estimativa.</strong><br>As previsões vêm do método do calendário e podem errar, principalmente em ciclos irregulares.</div>'}),
    el('div',{class:'aviso',style:'margin-bottom:var(--sp-4)',html:
      '<span class="glifo">&#9888;</span><div><strong>Não é método contraceptivo.</strong><br>As informações sobre período fértil e ovulação são estimativas e podem apresentar erros. Não utilize o aplicativo para evitar uma gravidez. Para prevenção, utilize métodos contraceptivos adequados e procure orientação de um profissional de saúde.</div>'}),
    el('div',{class:'aviso',html:
      '<span class="glifo">&#9825;</span><div><strong>Não substitui seu médico.</strong><br>O Ciclo Femme não é um dispositivo médico e não faz diagnóstico. Em caso de sintomas importantes, dor fora do comum, sangramento atípico ou qualquer dúvida de saúde, procure um profissional.</div>'}),
    el('div',{style:'margin-top:var(--sp-6)'}, linhaAlternador('Li e entendi como o app funciona.', btnAceite))
  );

  var erro = el('div',{class:'campo erro oculto',role:'alert'});
  var btn = el('button',{class:'btn',texto:'Continuar',style:'margin-top:var(--sp-5)'});

  tela.innerHTML = '';
  tela.append(s1, s2, s3, erro, btn);

  function desenhar(){
    s1.classList.toggle('oculto', etapa !== 1);
    s2.classList.toggle('oculto', etapa !== 2);
    s3.classList.toggle('oculto', etapa !== 3);
    Array.prototype.forEach.call(barra.children, function(sp,i){ sp.classList.toggle('feito', i < etapa); });
    btn.textContent = etapa === TOTAL ? 'Entrar no Ciclo Femme' : 'Continuar';
    erro.classList.add('oculto');
    window.scrollTo(0,0);
  }
  desenhar();

  function validar(){
    if (etapa === 1){
      if (!nome.value.trim()) return 'Escreva como quer ser chamada.';
      if (!nascimento.value) return 'Informe sua data de nascimento.';
      if (difDias(nascimento.value, hojeISO()) < 0) return 'Essa data ainda não chegou. Confira o ano.';
    }
    if (etapa === 2){
      if (!ultima.value) return 'Informe o primeiro dia da última menstruação.';
      if (difDias(ultima.value, hojeISO()) < 0) return 'Essa data é futura. Escolha um dia que já passou.';
      if (difDias(ultima.value, hojeISO()) > 180) return 'Essa data é muito antiga para gerar uma estimativa útil.';
      var dc = Number(dCiclo.value), dm = Number(dMenst.value);
      if (!(dc >= 21 && dc <= 45)) return 'A duração do ciclo deve ficar entre 21 e 45 dias.';
      if (!(dm >= 1 && dm <= 10)) return 'A duração da menstruação deve ficar entre 1 e 10 dias.';
      if (dm >= dc) return 'A menstruação não pode durar o ciclo inteiro. Revise os dois números.';
    }
    if (etapa === 3 && !aceitou) return 'Confirme que leu como o app funciona para continuar.';
    return null;
  }

  btn.onclick = function(){
    var problema = validar();
    if (problema){ erro.textContent = problema; erro.classList.remove('oculto'); return; }
    if (etapa < TOTAL){ etapa++; return desenhar(); }
    ocupar(btn, true);
    salvarPerfil({
      firstName: nome.value.trim(),
      lastName: sobrenome.value.trim() || null,
      birthDate: nascimento.value,
      isAnonymous: !!auth.currentUser.isAnonymous
    }).then(function(){
      return salvarConfigCiclo({
        ultimaMenstruacao: ultima.value,
        duracaoCiclo: Number(dCiclo.value),
        duracaoMenstruacao: Number(dMenst.value),
        ajusteAutomatico: true
      });
    }).then(function(){ return registrarCiclo(ultima.value); })
      .then(function(){ return iniciarApp(); })
      .catch(function(e){
        console.error(e);
        erro.textContent = mensagemErro(e);
        erro.classList.remove('oculto');
        ocupar(btn, false, 'Entrar no Ciclo Femme');
      });
  };
}

/* Anel do ciclo. `segmentos` desenha as fases no aro externo;
   `progresso` (0 a 1) desenha o arco dourado-rosa e o ponto de hoje. */
function anelCiclo(op){
  var R = 96, RE = 112, circ = 2*Math.PI*R, circE = 2*Math.PI*RE;
  var prog = Math.min(1, Math.max(0, op.progresso || 0));
  var ang = (-90 + 360*prog) * Math.PI/180;
  var px = 120 + R*Math.cos(ang), py = 120 + R*Math.sin(ang);

  function arco(de, ate, cor){
    var len = Math.max(1, (ate - de) * circE);
    return '<circle class="fase-arco" cx="120" cy="120" r="'+RE+'" stroke="'+cor+'" stroke-width="7" '+
      'stroke-dasharray="'+len+' '+(circE-len)+'" stroke-dashoffset="'+(-de*circE)+'" '+
      'transform="rotate(-90 120 120)"/>';
  }
  var fases = (op.segmentos || []).map(function(g){ return arco(g.de, g.ate, g.cor); }).join('');

  return el('div',{class:'anel-envoltorio',html:
    '<div style="position:relative">'+
      '<svg class="anel" viewBox="0 0 240 240" role="img" aria-label="'+(op.acessivel||'Progresso do ciclo')+'">'+
      '<defs><linearGradient id="gradRosa" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0%" stop-color="#E79DAF"/><stop offset="55%" stop-color="#D1506B"/>'+
      '<stop offset="100%" stop-color="#8E63C4"/></linearGradient></defs>'+
      '<circle class="trilho" cx="120" cy="120" r="'+R+'"/>'+
      fases +
      '<circle class="progresso" cx="120" cy="120" r="'+R+'" stroke-dasharray="'+circ+'" '+
      'stroke-dashoffset="'+(circ*(1-prog))+'" transform="rotate(-90 120 120)"/>'+
      (prog > 0 ? '<circle class="ponto-hoje" cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="7"/>' : '')+
      '</svg>'+
      '<div class="anel-texto" style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 42px">'+
        '<div class="rotulo">'+op.rotulo+'</div>'+
        (op.numero ? '<div class="numero">'+op.numero+'</div>' : '')+
        (op.detalhe ? '<div class="previsao">'+op.detalhe+'</div>' : '')+
      '</div></div>'});
}

function segmentosDasFases(cfg, inicio){
  var c = normalizar(cfg), m = marcosDoCiclo(c, inicio), dur = c.duracaoCiclo;
  function f(iso){ return Math.min(1, Math.max(0, difDias(inicio, iso)/dur)); }
  return [
    {de:0, ate:f(m.fimMenstruacao)+1/dur, cor:'var(--rosa-300)'},
    {de:f(m.inicioFertil), ate:f(m.fimFertil)+1/dur, cor:'var(--verde-500)'},
    {de:f(m.ovulacao), ate:f(m.ovulacao)+1/dur, cor:'var(--lilas-500)'},
    {de:f(m.inicioTPM), ate:1, cor:'var(--lilas-300)'}
  ];
}

/* "setembro de 2026" -> "Setembro 2026". O text-transform capitalize
   deixava "Setembro De 2026", com o De maiúsculo no meio. */
function nomeDoMes(data){
  var m = data.toLocaleDateString('pt-BR', {month:'long'});
  return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + data.getFullYear();
}

function desenharCalendario(){
  var wrap = el('div',{class:'calendario'});
  var ref = estado.mesVisivel, ano = ref.getFullYear(), mes = ref.getMonth();
  var cab = el('div',{class:'calendario-cabecalho'});
  cab.append(
    el('button',{class:'btn-icone','aria-label':'Mês anterior',html:'&#8249;',
      onclick:function(){ estado.mesVisivel = new Date(ano, mes-1, 1); renderizar(); }}),
    el('div',{class:'calendario-mes',texto:nomeDoMes(ref)}),
    el('button',{class:'btn-icone','aria-label':'Próximo mês',html:'&#8250;',
      onclick:function(){ estado.mesVisivel = new Date(ano, mes+1, 1); renderizar(); }})
  );
  wrap.append(cab);

  var grade = el('div',{class:'calendario-grade'});
  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(function(d){
    grade.append(el('div',{class:'calendario-dia-semana',texto:d}));
  });
  var desloc = (new Date(ano, mes, 1).getDay() + 6) % 7;
  var total = new Date(ano, mes+1, 0).getDate();
  var mapa = mapaDoMes(estado.config, ano, mes), hoje = hojeISO();
  for (var i = 0; i < desloc; i++) grade.append(el('div',{class:'dia vazio'}));
  for (var d = 1; d <= total; d++){
    (function(dia){
      var iso = paraISO(new Date(ano, mes, dia));
      var fase = mapa[iso];
      var cls = 'dia' + (fase ? ' ' + FASES[fase].classe : '') + (iso === hoje ? ' hoje' : '');
      grade.append(el('button',{class:cls,texto:String(dia),
        onclick:function(){ estado.dataRegistro = iso; irPara('registrar-dia'); }}));
    })(d);
  }
  wrap.append(grade);

  var leg = el('div',{class:'legenda'});
  ['menstruacao','fertil','ovulacao','tpm'].forEach(function(k){
    leg.append(el('div',{class:'legenda-item',html:
      '<span class="legenda-cor" style="background:'+FASES[k].cor+'"></span>'+FASES[k].nome}));
  });
  wrap.append(leg);
  return wrap;
}

/* Marcar fluxo num dia distante do último início vira um novo ciclo. */
function talvezNovoCiclo(data){
  var cfg = estado.config;
  if (!acompanhandoCiclo()) return Promise.resolve();   // gestação, pós-parto, menopausa
  if (!cfg || !cfg.ultimaMenstruacao) return Promise.resolve();
  if (difDias(cfg.ultimaMenstruacao, data) < 18) return Promise.resolve();
  if (difDias(data, hojeISO()) < 0) return Promise.resolve();
  return registrarCiclo(data).then(listarCiclos).then(function(cs){
    estado.ciclos = cs;
    estado.analise = analisarCiclos(cs);
    var media = cfg.ajusteAutomatico !== false ? mediaDosCiclos(cs) : null;
    var novo = {
      ultimaMenstruacao: data,
      duracaoCiclo: media || cfg.duracaoCiclo,
      duracaoMenstruacao: cfg.duracaoMenstruacao,
      ajusteAutomatico: cfg.ajusteAutomatico
    };
    estado.config = normalizar(novo);
    avisar('Novo ciclo registrado a partir desta data.');
    return salvarConfigCiclo(novo);
  });
}

        .then(function(ok){ avisarSalvo(ok); irPara('registros'); })
        .catch(function(e){ console.error(e); avisar(mensagemErro(e)); ocupar(btn,false,'Salvar registro'); });
    };
  });
};

TELAS.historico = function(){
  cabecalho({titulo:'Histórico', voltar:'registros'});
  return listarDiarios().then(function(lista){
    tela.innerHTML = '';
    var v = el('div',{class:'tela'});
    if (!lista.length){
      v.append(el('div',{class:'vazio',html:'<span class="glifo">&#9675;</span>Nenhum registro ainda. Comece pelo dia de hoje.'}));
      v.append(el('button',{class:'btn',texto:'Registrar hoje',
        onclick:function(){ estado.dataRegistro = hojeISO(); irPara('registrar-dia'); }}));
      return tela.append(v);
    }
    lista.forEach(function(r){
      var partes = [];
      if (r.flow) partes.push('fluxo ' + rotulo(FLUXOS, r.flow).toLowerCase());
      if (r.mood) partes.push(rotulo(HUMORES, r.mood).toLowerCase());
      if (r.symptoms && r.symptoms.length) partes.push(r.symptoms.length + ' sintoma' + (r.symptoms.length>1?'s':''));
      v.append(el('button',{class:'cartao-link',style:'margin-bottom:var(--sp-2)',
        onclick:function(){ estado.dataRegistro = r.date; irPara('registrar-dia'); },
        html:'<span><strong>'+formatarDataLonga(r.date)+'</strong>'+
          '<span class="texto-suave" style="display:block">'+(partes.join(' · ') || 'Sem detalhes')+'</span></span>'+
          '<span class="seta">&#8250;</span>'}));
    });
    tela.append(v);
  });
};
function rotulo(lista, valor){
  for (var i = 0; i < lista.length; i++) if (lista[i][0] === valor) return lista[i][1];
  return valor;
}

  var iUltima = el('input',{type:'date',value:cfg.ultimaMenstruacao || ''});

  var c = el('div',{class:'cartao'});
  c.append(linhaAlternador('Ajustar a média automaticamente pelos meus registros', bAjuste));

  v.append(el('button',{class:'cartao-link',style:'margin-top:var(--sp-4)',

    html:'<span><strong>Meus ciclos anteriores</strong>'+
      '<span class="texto-suave" style="display:block">Adicionar registros antigos para melhorar a previsão</span></span>'+
      '<span class="seta">&#8250;</span>'}));

  var erro = el('div',{class:'campo erro oculto',role:'alert'});

  v.append(erro, btn);
  tela.append(v);

  btn.onclick = function(){
    var u = iUltima.value, dc = Number(iCiclo.value), dm = Number(iMenst.value);
    var problema = !u ? 'Informe o primeiro dia da última menstruação.'
      : difDias(u, hojeISO()) < 0 ? 'Essa data é futura. Escolha um dia que já passou.'
      : !(dc >= 21 && dc <= 45) ? 'A duração do ciclo deve ficar entre 21 e 45 dias.'
      : !(dm >= 1 && dm <= 10) ? 'A duração da menstruação deve ficar entre 1 e 10 dias.'
      : dm >= dc ? 'A menstruação não pode durar o ciclo inteiro. Revise os dois números.' : null;

      .then(function(){ return registrarCiclo(u); })
      .then(listarCiclos)
      .then(function(cs){
        estado.ciclos = cs; estado.config = normalizar(novo); aplicarHistorico();
        avisar('Dados atualizados.'); irPara('inicio');

      .catch(function(e){ console.error(e); avisar(mensagemErro(e)); ocupar(btn,false,'Salvar alterações'); });

TELAS['ciclos-anteriores'] = function(){
  cabecalho({titulo:'Meus ciclos anteriores', voltar:'mais'});
  tela.innerHTML = '';
  var v = el('div',{class:'tela'});

  v.append(el('p',{class:'texto-suave',style:'margin-bottom:var(--sp-5)',
    texto:'Adicione o primeiro dia de menstruação de cada mês que você já tem anotado. Pode ser de uma agenda, de outro app ou de memória. Quanto mais ciclos, melhor fica a previsão.'}));

  var iData = el('input',{type:'date',max:hojeISO()});
  v.append(campo('Primeiro dia da menstruação', iData));
  var erro = el('div',{class:'campo erro oculto',role:'alert'});
  var btnAdd = el('button',{class:'btn',texto:'Adicionar este ciclo'});
  var nota = el('div',{class:'nota-ciclo oculto'});
  v.append(erro, btnAdd, nota);

  function mostrarNota(r){
    nota.className = 'nota-ciclo ' + (r.classe || '');
    nota.innerHTML = '<strong>' + r.titulo + '</strong>' + r.texto +
      (r.rodape ? '<span class="rodape">' + r.rodape + '</span>' : '');
  }

  // --- Resumo do que o histórico já diz ---
  var a = estado.analise;
  if (a && a.n){
    var rotuloConfianca = a.confianca === 'alta' ? 'Seus ciclos são bem regulares.'
      : a.confianca === 'media' ? 'Seus ciclos variam um pouco.'
      : 'Seus ciclos variam bastante, então a previsão é mais aproximada.';
    v.append(el('div',{class:'cartao',style:'margin-top:var(--sp-6)',html:
      '<strong>Duração típica: ' + a.mediana + ' dias</strong>' +
      '<p class="texto-suave" style="margin-top:var(--sp-2)">' +
      'O mais curto teve ' + a.menor + ' dias e o mais longo ' + a.maior + '. ' + rotuloConfianca + '</p>'}));
  }

  // --- Lista dos ciclos registrados ---
  v.append(el('h2',{class:'secao-titulo',texto:'Ciclos registrados'}));
  var lista = el('div');
  v.append(lista);
  v.append(el('p',{class:'aviso-rodape',texto:
    'A previsão usa a mediana dos seus últimos ciclos, não a média, para que um mês atípico não desloque todas as datas. Ainda assim é uma estimativa.'}));
  tela.append(v);

  function desenharLista(){
    lista.innerHTML = '';
    var inicios = estado.ciclos.map(function(c){ return c.startDate; }).filter(Boolean).sort();
    if (!inicios.length){
      lista.append(el('div',{class:'vazio',html:
        '<span class="glifo">&#9675;</span>Nenhum ciclo registrado ainda.'}));
      return;
    }
    inicios.slice().reverse().forEach(function(iso, i){
      var pos = inicios.length - 1 - i;
      var intervalo = pos > 0 ? difDias(inicios[pos-1], iso) : null;
      var linha = el('div',{class:'cartao',
        style:'display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)'});
      linha.append(
        el('span',{style:'width:10px;height:10px;border-radius:50%;background:var(--rosa-500);flex:none'}),
        el('span',{style:'flex:1',html:
          '<strong>'+formatarDataLonga(iso)+'</strong>'+
          '<span class="texto-suave" style="display:block">'+
          (intervalo
            ? intervalo + ' dias depois do anterior <span class="marca ' +
              (classificarIntervalo(intervalo) === 'comum' ? 'ok">faixa comum' : 'fora">fora da faixa') + '</span>'
            : 'primeiro ciclo registrado')+'</span>'}),
        el('button',{class:'btn-icone','aria-label':'Remover este ciclo',
          html:'&#10005;', style:'color:var(--danger)',
          onclick:function(){ remover(iso); }})
      );
      lista.append(linha);
    });
  }
  desenharLista();

  function recarregar(){
    return listarCiclos().then(function(cs){
      estado.ciclos = cs;
      aplicarHistorico();
      desenharLista();
    });
  }

  function remover(iso){
    if (!confirm('Remover o ciclo de ' + formatarDataLonga(iso) + '?')) return;
    excluirCiclo(iso).then(recarregar)
      .then(function(){ avisar('Ciclo removido.'); })
      .catch(function(e){ console.error(e); avisar(mensagemErro(e)); });
  }

  btnAdd.onclick = function(){
    var d = iData.value;
    var jaTem = estado.ciclos.some(function(c){ return c.startDate === d; });
    var problema = !d ? 'Escolha a data do primeiro dia de menstruação.'
      : difDias(d, hojeISO()) < 0 ? 'Essa data é futura. Escolha um dia que já passou.'
      : difDias(d, hojeISO()) > 1460 ? 'Essa data é de mais de quatro anos atrás.'
      : jaTem ? 'Esse ciclo já está na lista.' : null;
    if (problema){ erro.textContent = problema; erro.classList.remove('oculto'); return; }
    erro.classList.add('oculto');
    ocupar(btnAdd, true);
    registrarCiclo(d)
      .then(recarregar)
      .then(function(){
        // Se for o ciclo mais recente, ele passa a ser a âncora das previsões.
        if (estado.config && estado.analise && estado.analise.ultimoInicio === d){
          return salvarConfigCiclo({
            ultimaMenstruacao: d,
            duracaoCiclo: estado.config.duracaoCiclo,
            duracaoMenstruacao: estado.config.duracaoMenstruacao,
            ajusteAutomatico: estado.config.ajusteAutomatico
          });
        }
      })
      .then(function(){
        iData.value = '';
        ocupar(btnAdd, false, 'Adicionar este ciclo');
        mostrarNota(lerCicloAdicionado(d));
      })
      .catch(function(e){
        console.error(e);
        avisar(mensagemErro(e));
        ocupar(btnAdd, false, 'Adicionar este ciclo');
      });
  };
};

   mostrar estimativas que não valem para o momento.
   ========================================================= */
var MODOS = {

  },

    rodape:'As semanas mostradas são uma estimativa a partir da data que você informou. O acompanhamento da gestação é do seu pré-natal, não deste aplicativo.'
  },
  'pos-parto': {

  },

  },
  'sem-ciclo': {
    nome:'Sem ciclo no momento',
    descricao:'Para quem usa contraceptivo contínuo ou não menstrua agora. Mantém os registros, sem previsões.',
    campo:null,
    rodape:'Neste modo o app guarda seus registros, mas não estima datas.'
  }
};
function modoAtual(){ return (estado.modo && MODOS[estado.modo.modo]) ? estado.modo.modo : 'ciclo'; }
function acompanhandoCiclo(){ return modoAtual() === 'ciclo'; }

function semanasEDias(dias){
  var sem = Math.floor(dias/7), d = dias % 7;
  return sem + (sem === 1 ? ' semana' : ' semanas') + (d ? ' e ' + d + (d === 1 ? ' dia' : ' dias') : '');
}

function cartaoDoModo(){
  var m = modoAtual(), ref = estado.modo && estado.modo.referencia;
  var def = MODOS[m];

  if (m === 'gestante' && ref){
    var dias = difDias(ref, hojeISO());
    var dpp = somarDias(ref, 280);
    return el('div',{},[
      anelCiclo({
        progresso: Math.min(1, dias/280),
        segmentos: [{de:0, ate:13/40, cor:'var(--rosa-300)'},
                    {de:13/40, ate:27/40, cor:'var(--verde-500)'},
                    {de:27/40, ate:1, cor:'var(--lilas-300)'}],
        rotulo:'Você está em',
        numero: Math.floor(dias/7) + (Math.floor(dias/7) === 1 ? ' semana' : ' semanas'),
        detalhe: semanasEDias(dias),
        acessivel:'Semanas de gestação estimadas'
      }),
      el('p',{class:'texto-suave',style:'text-align:center',
        texto:'Data provável do parto: ' + formatarDataLonga(dpp) + '.'}),
      el('p',{class:'texto-suave',style:'text-align:center;font-size:var(--t-micro);margin-top:var(--sp-1)',
        texto:'Estimativa pela data que você informou. O pré-natal pode ter outra data, e é a dela que vale.'})
    ]);
  }

  if (m === 'pos-parto' && ref){
    var d2 = difDias(ref, hojeISO());
    return el('div',{class:'cartao-modo',html:
      '<div class="rotulo">Desde o nascimento</div>'+
      '<div class="numero">'+Math.floor(d2/7)+(Math.floor(d2/7) === 1 ? ' semana' : ' semanas')+'</div>'+
      '<div class="rotulo">'+semanasEDias(d2)+'</div>'+
      '<p class="texto-suave" style="margin-top:var(--sp-4)">Quando a menstruação voltar, registre o primeiro dia: o app volta a calcular seus ciclos a partir dali.</p>'});
  }

  if (m === 'menopausa' && ref){
    var d3 = difDias(ref, hojeISO()), meses = Math.floor(d3/30);
    return el('div',{class:'cartao-modo',html:
      '<div class="rotulo">Desde a última menstruação</div>'+
      '<div class="numero">'+(meses < 1 ? d3 + (d3 === 1 ? ' dia' : ' dias') : meses + (meses === 1 ? ' mês' : ' meses'))+'</div>'+
      '<div class="rotulo">'+formatarDataLonga(ref)+'</div>'+
      '<p class="texto-suave" style="margin-top:var(--sp-4)">'+
      (d3 >= 365 ? 'Já passou de doze meses. Vale conversar com um profissional de saúde sobre este momento.'
                 : 'Continue registrando sintomas: esse histórico ajuda muito na consulta.')+'</p>'});
  }

  return el('div',{class:'cartao-modo',html:
    '<div class="rotulo">Seu momento</div>'+
    '<div class="numero" style="font-size:var(--t-h1)">'+def.nome+'</div>'+
    '<p class="texto-suave" style="margin-top:var(--sp-3)">'+def.descricao+'</p>'});
}

TELAS['modo-vida'] = function(){
  cabecalho({titulo:'Meu momento', voltar:'mais'});
  tela.innerHTML = '';
  var v = el('div',{class:'tela'});
  v.append(el('p',{class:'texto-suave',style:'margin-bottom:var(--sp-5)',
    texto:'O corpo não fica no mesmo ritmo a vida toda. Escolha o momento em que você está — dá para trocar quando quiser, e nada do que você já registrou se perde.'}));

  var escolhido = modoAtual();
  var ref = (estado.modo && estado.modo.referencia) || '';
  var iRef = el('input',{type:'date',max:hojeISO(),value:ref});
  var caixaRef = campo('Data de referência', iRef);
  var lista = el('div');

  Object.keys(MODOS).forEach(function(k){
    var b = el('button',{class:'cartao-link',style:'margin-bottom:var(--sp-2)',
      html:'<span style="width:12px;height:12px;border-radius:50%;flex:none;background:'+
        (k === escolhido ? 'var(--rosa-500)' : 'var(--creme-200)')+'"></span>'+
        '<span><strong>'+MODOS[k].nome+'</strong><span class="texto-suave" style="display:block">'+
        MODOS[k].descricao+'</span></span>',
      onclick:function(){ escolhido = k; desenhar(); }});
    b.dataset.modo = k;
    lista.append(b);
  });
  v.append(lista, caixaRef);

  var erro = el('div',{class:'campo erro oculto',role:'alert'});
  var btn = el('button',{class:'btn',texto:'Salvar meu momento'});
  var rodape = el('p',{class:'aviso-rodape'});
  v.append(erro, btn, rodape);
  tela.append(v);

  function desenhar(){
    Array.prototype.forEach.call(lista.children, function(b){
      b.querySelector('span').style.background = b.dataset.modo === escolhido ? 'var(--rosa-500)' : 'var(--creme-200)';
    });
    var def = MODOS[escolhido];
    caixaRef.classList.toggle('oculto', !def.campo);
    if (def.campo){
      caixaRef.querySelector('label').textContent = def.campo;
      var ajuda = caixaRef.querySelector('.ajuda');
      if (!ajuda){ ajuda = el('div',{class:'ajuda'}); caixaRef.append(ajuda); }
      ajuda.textContent = def.ajuda || '';
    }
    rodape.textContent = def.rodape || '';
    erro.classList.add('oculto');
  }
  desenhar();

  btn.onclick = function(){
    var def = MODOS[escolhido];
    if (def.campo && !iRef.value){
      erro.textContent = 'Informe a data de referência para este momento.';
      erro.classList.remove('oculto'); return;
    }
    if (def.campo && difDias(iRef.value, hojeISO()) < 0){
      erro.textContent = 'Essa data é futura. Escolha um dia que já passou.';
      erro.classList.remove('oculto'); return;
    }
    ocupar(btn, true);
    var novo = {modo:escolhido, referencia: def.campo ? iRef.value : null};
    salvarModoVida(novo)
      .then(function(ok){ estado.modo = novo; avisarSalvo(ok, 'Momento atualizado.'); irPara('inicio'); })
      .catch(function(e){ console.error(e); avisar(mensagemErro(e)); ocupar(btn,false,'Salvar meu momento'); });
  };
};

/* =========================================================
   8D. EXAMES PREVENTIVOS
   A periodicidade é escolhida pela usuária, porque quem define
   isso é o profissional que a acompanha — o app só lembra.
   ========================================================= */
var TIPOS_EXAME = [
  ['preventivo','Preventivo (Papanicolau)'],
  ['mamografia','Mamografia'],
  ['ultrassom','Ultrassonografia'],
  ['sangue','Exames de sangue'],
  ['consulta','Consulta ginecológica'],
  ['vacina','Vacina'],
  ['outro','Outro']
];
var INTERVALOS = [[0,'Sem lembrete'],[6,'A cada 6 meses'],[12,'A cada 1 ano'],
                  [24,'A cada 2 anos'],[36,'A cada 3 anos'],[60,'A cada 5 anos']];

function mesesEntre(iso, ate){ return Math.floor(difDias(iso, ate)/30.44); }

function situacaoExame(e){
  if (!e.intervalMonths) return {classe:'neutra', texto:'sem lembrete'};
  var venc = somarDias(e.date, Math.round(e.intervalMonths*30.44));
  var faltam = difDias(hojeISO(), venc);
  var quando = formatarData(venc, {month:'long', year:'numeric'});
  if (faltam < 0) return {classe:'alerta', texto:'passou do prazo que você definiu (' + quando + ')', vencimento:venc};
  if (faltam <= 60) return {classe:'fora', texto:'previsto para ' + quando, vencimento:venc};
  return {classe:'ok', texto:'em dia até ' + quando, vencimento:venc};
}
